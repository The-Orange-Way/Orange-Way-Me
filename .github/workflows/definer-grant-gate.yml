name: Definer grant gate

# Refuses an EXECUTE grant to anon or to PUBLIC on any SECURITY DEFINER
# function in the public schema. The live-database jobs, including why they
# read a live database rather than the migration files, are documented in
# scripts/check-definer-grants.sh. The pull-request job is a complement, not
# a replacement, documented in scripts/check-definer-grant-migrations.sh.
#
# THREE JOBS.
#
# definer-grants-dev and definer-grants-prod read a LIVE database and bind to
# their own GitHub Environment (dev, prod), so the dev run never has the
# production credential in scope and the production run never has dev's.
# They run on the push that can actually change that database, on the daily
# schedule (for grants that arrive with no commit behind them at all, because
# CREATE OR REPLACE resets EXECUTE to PUBLIC even after a clean revoke), and
# on demand. A push to dev cannot change production, so it only triggers the
# dev job; a push to prod only triggers the prod job. Schedule and manual
# dispatch run both, because neither is scoped to one push.
#
# definer-grants-pr-scan is a pull request check. It cannot see the live
# database and it does not try to; it scans the migration files the PR
# changes and enforces TWO rules, both documented in
# scripts/check-definer-grant-migrations.sh:
#   1. no added GRANT ... EXECUTE ... TO anon or PUBLIC, unless the function
#      is on the same allowlist the live jobs use;
#   2. no added CREATE or CREATE OR REPLACE of one of the hardened SECURITY
#      DEFINER functions unless the same file re-applies its REVOKE EXECUTE
#      FROM PUBLIC and anon, because Postgres resets EXECUTE to PUBLIC on a
#      replaced function with no GRANT line for rule 1 to find.
# This is the one moment a human is still looking before the change ever
# reaches a database, which the live jobs cannot cover: they only ever report
# on a grant that is already live, on the push to that branch or on the next
# daily run.
#
# The job self-tests both rules before it scans anything. A rule that has been
# edited into always passing looks exactly like a clean pull request, so the
# fixtures run first and the job fails if either rule stops going red on the
# thing it exists for.
#
# The two live-database jobs below are gated with a positive list of their
# three intended triggers (push to their own branch, schedule, dispatch),
# not by excluding pull_request by name, so adding a future trigger cannot
# silently switch them on again.

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev]
    paths:
      - 'supabase/migrations/**'
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref to inspect. Empty means each job inspects its own project. Set a ref that does not resolve to force the gate red, which is how the cannot check path is proven.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  definer-grants-dev:
    name: SECURITY DEFINER EXECUTE grants (live dev database)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Refuse anon or PUBLIC EXECUTE on SECURITY DEFINER functions (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The script has no default project, on purpose, so the ref is passed
          # explicitly here. A manual run can override it; a push or a schedule
          # gets the dev project.
          OW_DEFINER_PROJECT_REF: ${{ github.event.inputs.project_ref || 'bogmoovbjpvcvdqrmjgt' }}
        run: bash scripts/check-definer-grants.sh

  definer-grants-prod:
    name: SECURITY DEFINER EXECUTE grants (live production database)
    runs-on: ubuntu-latest
    # A push to dev cannot move the production database, so a push event only
    # runs this job when the push landed on prod. Schedule and manual dispatch
    # are not scoped to a branch push, so they always run it.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/prod') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment: prod
    steps:
      - uses: actions/checkout@v6

      - name: Refuse anon or PUBLIC EXECUTE on SECURITY DEFINER functions (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OW_DEFINER_PROJECT_REF: ${{ github.event.inputs.project_ref || 'tmqjusxxjjcsdgyiqbcg' }}
        run: bash scripts/check-definer-grants.sh

  definer-grants-pr-scan:
    name: 'SECURITY DEFINER (changed migrations): no anon or PUBLIC EXECUTE grant, no replace without re-revoke'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Self-test both migration scan rules
        run: bash scripts/check-definer-grant-migrations.sh --self-test

      - name: Refuse a new anon or PUBLIC EXECUTE grant, or a hardened definer function replaced without its revoke
        run: |
          bash scripts/check-definer-grant-migrations.sh \
            "origin/${{ github.event.pull_request.base.ref }}" \
            "${{ github.event.pull_request.head.sha }}"
