name: Definer grant gate

# Refuses an EXECUTE grant to anon or to PUBLIC on any SECURITY DEFINER
# function in the public schema. The whole check, including why it reads a live
# database rather than the migration files, is documented in
# scripts/check-definer-grants.sh.
#
# TWO JOBS, TWO ENVIRONMENTS, TWO RESULTS. Dev and production are separate jobs
# so each reports its own pass, violation or cannot check outcome, and so each
# binds to its own GitHub Environment: the dev run never has the production
# credential in scope and the production run never has dev's. A job is the unit
# an Environment binds to, which is why this is two jobs rather than two steps.
#
# This is NOT a pull request check. A pull request cannot move a live database,
# so a red here would be somebody else's drift blocking an unrelated merge. It
# runs where the database can actually have changed: a push to dev, and once a
# day for grants that arrive with no commit behind them at all.
#
# The production job does not run on push, because a push to dev cannot change
# the production database. It runs on the daily schedule and on demand.

on:
  push:
    branches: [dev]
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref to inspect. Empty means each job inspects its own project. Set a ref that does not resolve to force the gate red, which is how the cannot check path is proven.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  definer-grants-dev:
    name: SECURITY DEFINER EXECUTE grants (live dev database)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Refuse anon or PUBLIC EXECUTE on SECURITY DEFINER functions (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The script has no default project, on purpose, so the ref is passed
          # explicitly here. A manual run can override it; a push or a schedule
          # gets the dev project.
          OW_DEFINER_PROJECT_REF: ${{ github.event.inputs.project_ref || 'bogmoovbjpvcvdqrmjgt' }}
        run: bash scripts/check-definer-grants.sh

  definer-grants-prod:
    name: SECURITY DEFINER EXECUTE grants (live production database)
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    environment: prod
    steps:
      - uses: actions/checkout@v6

      - name: Refuse anon or PUBLIC EXECUTE on SECURITY DEFINER functions (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OW_DEFINER_PROJECT_REF: ${{ github.event.inputs.project_ref || 'tmqjusxxjjcsdgyiqbcg' }}
        run: bash scripts/check-definer-grants.sh
