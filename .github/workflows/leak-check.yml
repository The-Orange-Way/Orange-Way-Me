name: Leak check

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-publish-scan:
    name: Pre-publish leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify the reserved-term list is configured
        # Trusted runs only: a push to a protected branch, or a PR from a
        # branch in this repository that was opened by a real account.
        #
        # Fork PRs and Dependabot PRs never receive Actions secrets, so the
        # value is expected to be empty there and the scan skips the
        # reserved-term category by design.
        #
        # The Dependabot test keys off the ACTOR, never the branch name. A
        # branch prefix is chosen by whoever pushes it, so gating on a
        # "dependabot/" prefix would let anyone with write access skip this
        # hard fail at will. GitHub sets the actor.
        #
        # On a trusted run an empty value means the list is not configured on
        # this repository, and the scan would report green while checking for
        # nothing. Fail loudly instead. The term count is printed; the terms
        # themselves never are.
        if: >-
          github.actor != 'dependabot[bot]'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: |
          set -uo pipefail
          if [ -z "${OW_RESERVED_TERMS:-}" ]; then
            echo "::error::OW_RESERVED_TERMS is not configured on this repository. The reserved-term scan cannot run. Set it in Settings > Secrets and variables > Actions, one term per line."
            exit 1
          fi
          # Count through the SAME canonicalizer every consumer uses, so
          # the number printed here is the number of terms that will
          # actually be matched with, and not the number of lines in the
          # stored value.
          if [ ! -f scripts/canon-terms.sh ]; then
            echo "::error::scripts/canon-terms.sh is missing, so the reserved-term list cannot be canonicalized and this check cannot pass."
            exit 1
          fi
          . scripts/canon-terms.sh
          # Sourcing without an error is not the same as defining what this
          # step is about to call. Under the default `bash -e` shell a
          # library with a syntax error aborts the step at the line above,
          # so a partial source never reaches this guard. What does reach it
          # is a library that sources cleanly and still leaves a function
          # undefined: an early return, a conditional definition, or a name
          # deleted or renamed by a later edit. Ask for all three by name,
          # so a broken library names itself instead of sending the reader
          # to edit a reserved-term list that is fine.
          for FN in canon_terms canon_terms_usable canon_terms_reason_text; do
            if ! declare -f "$FN" >/dev/null 2>&1; then
              echo "::error::scripts/canon-terms.sh was sourced but defines no $FN; the reserved-term scan cannot run."
              exit 1
            fi
          done
          PATTERN="$(printf '%s\n' "$OW_RESERVED_TERMS" | canon_terms)"
          if [ -z "$PATTERN" ]; then
            echo "::error::OW_RESERVED_TERMS is configured but contains no usable terms: every line is blank or a comment. The reserved-term scan would check for nothing and report green. Set it in Settings > Secrets and variables > Actions, one term per line."
            exit 1
          fi
          # Configured and non-empty is still not the same as usable, and
          # there are three ways it can be unusable. Each line is a regex
          # FRAGMENT, so an unbalanced parenthesis or bracket is a
          # realistic typo in a value nobody can read back, and grep exits
          # 2 on a pattern it refuses. A fragment that matches the empty
          # string is the opposite problem: it compiles, and it matches
          # every line of every file. Every consumer of this list reads
          # both as "no matches", so the tree scan prints a green tick and
          # the identity scan prints "clean" while nothing is checked.
          #
          # Say which one it is. The sentence comes from
          # scripts/canon-terms.sh, where the question is asked, so all
          # four consumers report it the same way.
          if ! canon_terms_usable "$PATTERN"; then
            echo "::error::$(canon_terms_reason_text) Fix the offending line in Settings > Secrets and variables > Actions. No part of the value is printed."
            exit 1
          fi
          COUNT=$(printf '%s' "$PATTERN" | tr '|' '\n' | grep -c . || true)
          echo "Reserved-term list is configured on this repository ($COUNT terms)."

          # Windows line endings in the stored value: report, do not fail.
          # Every consumer strips them through the shared canonicalizer, so
          # matching is correct today and a hard failure here would block
          # every pull request on an edit only the repository owner can
          # make. It is still worth stating, because it is the one property
          # of this value that cannot be observed from outside, and any
          # future consumer that forgets to strip it will match nothing and
          # report clean. No part of the value is printed: only whether
          # removing carriage returns changed its length.
          RAW_LEN=$(printf '%s' "$OW_RESERVED_TERMS" | wc -c)
          STRIPPED_LEN=$(printf '%s' "$OW_RESERVED_TERMS" | tr -d '\r' | wc -c)
          if [ "$RAW_LEN" -ne "$STRIPPED_LEN" ]; then
            echo "::warning title=Reserved-term list has Windows line endings::The stored value contains carriage returns. Every consumer strips them through scripts/canon-terms.sh, so matching is correct today. Re-saving the secret with Unix line endings removes the hazard at the source."
          fi

      - name: Report that the reserved-term category cannot run here
        # A green check on these runs covers the structural checks only. In
        # the scan script the skip is one dim line in the log, so without
        # this notice a green reads as "the full scan passed" when category
        # 1 never ran.
        if: >-
          github.actor == 'dependabot[bot]'
          || github.event.pull_request.user.login == 'dependabot[bot]'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::notice title=Reserved-term scan skipped::Category 1, reserved terms, did not run on this pull request. GitHub withholds Actions secrets from Dependabot runs and from fork runs, so OW_RESERVED_TERMS is empty here and category 1 has nothing to check against. A green check on this run means the structural checks passed, not the full scan. The full scan runs on the push to dev after merge."

      - name: Reserved-term canonicalizer self test
        # Every consumer of the reserved-term list resolves it through one
        # shared function, so that function is a single point of failure
        # whose failure mode is silent: it returns a pattern that compiles,
        # matches nothing, and produces output identical to a clean tree.
        #
        # This needs no secret, so it runs on fork and Dependabot pull
        # requests too, where the reserved-term category itself cannot.
        #
        # The result line is asserted HERE, in the caller, and not only
        # inside the script. An assertion that lives in the file it
        # protects disappears with that file: bash exits 0 on a zero-byte
        # script, so a truncated self test printed nothing, this step went
        # green, and the whole leak check reported a pass having verified
        # nothing. The script's own case-count floor catches cases deleted
        # from the middle of an intact file; this catches the file not
        # running to the end at all. pipefail is set so tee cannot hide a
        # non-zero exit from the script.
        run: |
          set -euo pipefail
          bash scripts/test-canon-terms.sh | tee "$RUNNER_TEMP/canon-self-test.log"
          grep -qE '^[0-9]+ passed, 0 failed, [0-9]+ ran of [0-9]+ expected$' \
            "$RUNNER_TEMP/canon-self-test.log" \
            || { echo "::error::the canon-terms self test printed no result line, so it did not run to the end. A self test that cannot say how many cases ran has verified nothing."; exit 1; }

      - name: Leak scan red run self test
        # The reserved-term category withholds matched text in CI, and a
        # scanner that has been silenced produces output identical to a
        # clean tree. This drives the real scanner against a throwaway tree
        # holding an invented term and asserts it goes RED with the file and
        # the line, that the matched text is withheld, and that the same
        # list against a tree with no plant comes back green.
        #
        # Like the canonicalizer self test above it needs no secret, so it
        # runs on fork and Dependabot pull requests, where the reserved-term
        # category itself cannot.
        #
        # Asserted at the caller for the same reason as the step above: this
        # script decides its exit status on a failure counter alone, so a
        # truncated or emptied copy prints nothing, exits 0, and this step
        # goes green having driven no scanner at all. The output it tees is
        # fixture output only: the harness supplies its own invented terms
        # and never reads the real reserved-term list.
        run: |
          set -euo pipefail
          bash scripts/test-leak-scan-red.sh | tee "$RUNNER_TEMP/leak-red-self-test.log"
          grep -qE '^[0-9]+ passed, 0 failed$' \
            "$RUNNER_TEMP/leak-red-self-test.log" \
            || { echo "::error::the leak scan red run self test printed no result line, so it did not run to the end. A red-run proof that produced no result has proved nothing."; exit 1; }

      - name: Run pre-publish leak scan
        # Fails the job (and the required check) if any leak is found.
        # See scripts/pre-publish-scan.sh for the rules and exemptions.
        env:
          OW_RESERVED_TERMS: ${{ secrets.OW_RESERVED_TERMS }}
        run: bash scripts/pre-publish-scan.sh
