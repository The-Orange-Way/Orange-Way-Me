name: prod-drift-guard

# Fails loud when this repo's prod branch has drifted from dev.
# Two independent conditions, either one fails the job:
#   1. prod leads dev: prod carries file content that dev does not have.
#      Measured on the compare's files, not on its commit count, because a
#      promotion merge commit lands on prod and changes nothing.
#   2. dev runs too far ahead of prod: unpromoted commits over the divergence
#      limit (50 commits, or the oldest unpromoted commit older than 72 hours).
# A branch that cannot be resolved exits non-zero. "Could not check" is never green.
#
# The guard itself lives in scripts/prod-drift-guard.sh. It is a script and not
# an inline run block so that the negative-control job below can execute the
# SAME code and assert it refuses to report green. A negative control that
# re-implements the thing it tests, tests nothing.

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base/dev branch to compare against. Set a nonexistent branch to force the guard red (failure-path proof).'
        required: false
        default: dev
      head_branch:
        description: 'Head/prod branch to compare. Point it at a branch that carries content dev does not have to prove condition 1 goes red (failure-path proof).'
        required: false
        default: prod
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.inputs.base_branch || 'dev' }}
      HEAD_BRANCH: ${{ github.event.inputs.head_branch || 'prod' }}
      BEHIND_COMMIT_LIMIT: '50'
      BEHIND_HOURS_LIMIT: '72'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check prod vs dev drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/prod-drift-guard.sh

  drift-guard-negative-control:
    name: Drift guard refuses what it must
    runs-on: ubuntu-latest
    # Deliberately NOT the standing dev/prod pair. base=prod against head=prod
    # compares a branch with itself, so both of the guard's conditions find
    # nothing: this is exactly the input that used to make the guard print PASS.
    env:
      BASE_BRANCH: prod
      HEAD_BRANCH: prod
      BEHIND_COMMIT_LIMIT: '50'
      BEHIND_HOURS_LIMIT: '72'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: The guard must refuse a run that is not comparing dev against prod
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          rc=0
          bash scripts/prod-drift-guard.sh > proof-run.log 2>&1 || rc=$?
          echo "--- guard output (exit ${rc}) ---"
          cat proof-run.log
          echo "--- end guard output ---"

          if [ "$rc" -eq 0 ]; then
            echo "::error::negative control FAILED: the guard reported green with base='${BASE_BRANCH}' head='${HEAD_BRANCH}'. A run that is not comparing dev against prod is not a verdict on drift and must never end successfully." >&2
            exit 1
          fi

          # Exit code alone is not enough. The guard can go red for reasons that
          # have nothing to do with the refusal we are proving (an unresolvable
          # branch, a compare the API declined). Require the refusal's own line,
          # or this control would report green on the day the refusal stopped
          # working.
          if ! grep -q 'PROOF RUN, not a verdict' proof-run.log; then
            echo "::error::negative control FAILED: the guard exited ${rc}, but not for the proof-run reason, so this run does not prove the refusal still works. See the guard output above." >&2
            exit 1
          fi

          echo "negative control PASS: the guard exited ${rc} and refused the proof run."

  drift-guard-negative-control-files-null:
    name: Drift guard refuses an unchecked files:null compare
    runs-on: ubuntu-latest
    # This does not talk to the real GitHub API: it stubs `gh` so the
    # ahead-of-dev compare comes back with files:null and ahead_by > 0,
    # which is the exact shape that used to slip past a has("files")
    # presence check. It proves the type check in the guard still catches
    # that shape, without depending on prod and dev actually drifting.
    env:
      BASE_BRANCH: dev
      HEAD_BRANCH: prod
      BEHIND_COMMIT_LIMIT: '50'
      BEHIND_HOURS_LIMIT: '72'
      REPO: fake-org/fake-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stub gh so the compare's files field comes back null
        run: |
          mkdir -p "${RUNNER_TEMP}/fake-bin"
          cat > "${RUNNER_TEMP}/fake-bin/gh" <<'EOF'
          #!/usr/bin/env bash
          # Fake gh: answers only the calls prod-drift-guard.sh makes.
          if [ "$1" = "api" ]; then
            path="$2"
            case "$path" in
              */git/ref/heads/*)
                echo "deadbeef0000000000000000000000000000000"
                ;;
              */compare/dev...prod)
                echo '{"ahead_by":1,"files":null,"commits":[{"sha":"deadbeef0000000000000000000000000000000","commit":{"message":"fake prod-only commit"}}]}'
                ;;
              */compare/prod...dev)
                echo '{"ahead_by":0,"files":[],"commits":[]}'
                ;;
              *)
                echo "fake gh: unhandled api path: $path" >&2
                exit 1
                ;;
            esac
            exit 0
          fi
          echo "fake gh: unhandled args: $*" >&2
          exit 1
          EOF
          chmod +x "${RUNNER_TEMP}/fake-bin/gh"
          echo "${RUNNER_TEMP}/fake-bin" >> "$GITHUB_PATH"

      - name: The guard must refuse a files:null compare, not pass it through
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          rc=0
          bash scripts/prod-drift-guard.sh > files-null-run.log 2>&1 || rc=$?
          echo "--- guard output (exit ${rc}) ---"
          cat files-null-run.log
          echo "--- end guard output ---"

          if [ "$rc" -eq 0 ]; then
            echo "::error::negative control FAILED: the guard reported green when the compare's files field was null and ahead_by was greater than zero. A files:null compare must never be read as clean." >&2
            exit 1
          fi

          if ! grep -q "files field was not an array" files-null-run.log; then
            echo "::error::negative control FAILED: the guard exited ${rc}, but not for the files:null reason, so this run does not prove that specific check still works. See the guard output above." >&2
            exit 1
          fi

          echo "negative control PASS: the guard refused the files:null compare for the right reason."
