name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Pick environment label for this branch
        id: env_label
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "label=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "label=dev" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_ORBI_SUPABASE_URL: ${{ vars.VITE_ORBI_SUPABASE_URL }}
          VITE_ORBI_SUPABASE_ANON_KEY: ${{ vars.VITE_ORBI_SUPABASE_ANON_KEY }}
          # Observability — VITE_* is baked into the bundle at build time, so
          # the DSN MUST be passed here (Cloudflare Pages env vars wouldn't
          # take effect on a Wrangler-uploaded build). The wrapper at
          # src/lib/observability/sentry.ts is a no-op when DSN is unset.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Tags the env in Sentry so dev/prod errors don't pile up together.
          # import.meta.env.MODE/DEV is "production"/false during `vite build`
          # of either branch, so we derive it from the workflow ref instead.
          VITE_DEPLOY_ENV: ${{ steps.env_label.outputs.label }}
          # Open the sign-up form ONLY on the dev branch deploy. The
          # AuthScreen `SIGNUP_OPEN` constant reads
          # `import.meta.env.VITE_DEV_SIGNUP_OPEN === "1"`. Vite inlines
          # this at build time, so the prod bundle never contains the
          # flag-on branch of the code; the "Private beta" gate is the
          # only thing the prod build can render. Branch-derived rather
          # than repo-variable so a future env-var typo can't open prod.
          VITE_DEV_SIGNUP_OPEN: ${{ github.ref_name == 'dev' && '1' || '' }}
          # Cloudflare Turnstile captcha widget. Build-time inlined
          # public site key; the matching SECRET key lives in the
          # Supabase Auth project config (Studio: Auth -> Bot and
          # Abuse Protection -> CAPTCHA Protection -> Provider:
          # Cloudflare Turnstile -> Secret key). Per-env keys so the
          # dev widget can authenticate against a dev Turnstile site
          # bound to orangeway.dev, and prod against a separate site
          # bound to orangeway.app. Empty value when no captcha is
          # configured for the env yet; the SPA renders no widget and
          # submits without a token. Supabase Auth must also be
          # configured to skip captcha verification in that case.
          VITE_TURNSTILE_SITE_KEY: ${{ github.ref_name == 'prod' && vars.TURNSTILE_SITE_KEY_PROD || vars.TURNSTILE_SITE_KEY_DEV }}
          # Release identifier — paired with the source map upload step below
          # so Sentry can resolve minified prod stack traces ("index-XYZ.js:1457:52434")
          # back to readable filenames + line numbers from our checked-in source.
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload source maps to GlitchTip
        # Skip when DSN is unset (open-source contributors building dist locally
        # don't need to upload anywhere). The run block below also skips when
        # the auth token isn't configured — checking secrets.* in an `if:`
        # expression is what made the whole workflow fail validation in 0s on
        # previous attempts, so we keep the gate purely on vars.* here.
        if: ${{ vars.VITE_SENTRY_DSN != '' }}
        env:
          # GlitchTip is Sentry-protocol-compatible; sentry-cli talks to it
          # natively when SENTRY_URL points at the self-hosted instance.
          # SENTRY_URL is sourced from repo vars rather than hardcoded so
          # the source-map upload destination can be rotated without a
          # workflow edit. Fallback is the production URL.
          SENTRY_URL: ${{ vars.SENTRY_URL != '' && vars.SENTRY_URL || 'https://pulse.orangeway.app' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_ORG || 'orangeway' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT != '' && vars.SENTRY_PROJECT || 'orange-way-web' }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "GLITCHTIP_API_TOKEN not set in repo/env secrets — skipping source-map upload."
            exit 0
          fi
          # Install sentry-cli to a temp dir so we don't touch /usr (no sudo needed).
          curl -sL https://sentry.io/get-cli/ | INSTALL_DIR=/tmp/sentry-cli-bin bash
          export PATH="/tmp/sentry-cli-bin:$PATH"

          # Register the release on the GlitchTip side.
          sentry-cli releases new "$RELEASE"

          # Inject debug-ids into the built JS + .map files so the SDK can find
          # the right map for a given stack frame without needing sourceMappingURL
          # comments (vite.config.ts sets sourcemap: 'hidden').
          sentry-cli sourcemaps inject ./dist

          # Upload both .js and .js.map files. --strip-prefix drops the runner's
          # absolute build path so the displayed filename in GlitchTip is "src/..."
          # not "/home/runner/work/orange-way/orange-way/src/...".
          sentry-cli sourcemaps upload \
            --release "$RELEASE" \
            --strip-prefix "$GITHUB_WORKSPACE" \
            ./dist

          # Tie the release to the deploying commit (best-effort) and finalize.
          sentry-cli releases set-commits --auto "$RELEASE" || true
          sentry-cli releases finalize "$RELEASE"

      - name: Pick Pages project for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project=ow-prod" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://orangeway.app" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "project=ow-dev" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://orangeway.dev" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} — skipping deploy"
            exit 0
          fi

      - name: Deploy to ${{ steps.target.outputs.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.92.0 pages deploy dist \
            --project-name=${{ steps.target.outputs.project }} \
            --branch=${{ github.ref_name }} \
            --commit-dirty=true

      - name: Verify deploy
        run: |
          sleep 8
          ROUTES=$(curl -s ${{ steps.target.outputs.verify_url }} | grep -oE '/assets/routes-[^"]*\.js' | head -1 || true)
          if [ -z "$ROUTES" ]; then
            echo "::warning::Could not find routes chunk on ${{ steps.target.outputs.verify_url }}"
            exit 0
          fi
          curl -s "${{ steps.target.outputs.verify_url }}${ROUTES}" >/dev/null
          echo "✓ ${{ steps.target.outputs.verify_url }} routes chunk fetched OK"

      # E2E smoke against the freshly-deployed environment. Chromium
      # only on every push so deploys stay fast; the Firefox / WebKit
      # / mobile projects in playwright.config.ts run locally (and in
      # a future nightly matrix workflow). Tests stub /api/signup
      # internally, so this step does NOT actually call Resend.
      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Playwright smoke + marketing-form interaction
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.verify_url }}
        run: bunx playwright test --project=chromium --reporter=list

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.ref_name }}
          path: playwright-report/
          retention-days: 7
