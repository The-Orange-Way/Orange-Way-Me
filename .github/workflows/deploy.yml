name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # true is intentional for Cloudflare Pages. Two concurrent Wrangler uploads
  # can finish out of order: an older build can land on the edge after a newer
  # one, which is a silent stale-content failure. Cancellation is safe because
  # both pushes share the same branch -- the surviving run's commit is always a
  # superset of the cancelled one's content. Do not flip this to false.
  #
  # That safety depends on this job publishing ONE atomic artifact: a Pages
  # deploy replaces the whole site in a single step. A pipeline that also ships
  # Supabase edge functions has the opposite answer, because those apply per
  # function and incrementally, so cancelling mid run can leave some functions
  # updated and others not. If you find a sibling deploy workflow set to false,
  # it is almost certainly one that ships edge functions incrementally, where a
  # cancelled mid run leaves a partial deploy: that is a real reason, not drift,
  # and the two settings must NOT be harmonised. Check what a workflow ships
  # before assuming either is wrong.
  cancel-in-progress: true

# Least privilege for the automatic GITHUB_TOKEN. The deploy authenticates to
# Cloudflare and GlitchTip with their own tokens from secrets, and writes no
# GitHub state of its own, so read access to the checkout is the whole
# requirement. Matches the sibling Books repo's deploy workflow.
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Pick environment label for this branch
        id: env_label
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "label=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "label=dev" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_ORBI_SUPABASE_URL: ${{ vars.VITE_ORBI_SUPABASE_URL }}
          VITE_ORBI_SUPABASE_ANON_KEY: ${{ vars.VITE_ORBI_SUPABASE_ANON_KEY }}
          # Observability -- VITE_* is baked into the bundle at build time, so
          # the DSN MUST be passed here (Cloudflare Pages env vars wouldn't
          # take effect on a Wrangler-uploaded build). The wrapper at
          # src/lib/observability/sentry.ts is a no-op when DSN is unset.
          #
          # Per-env DSN so dev and prod errors land in separate projects and
          # alert rules can fire on prod only. Same branch-derived shape as
          # VITE_TURNSTILE_SITE_KEY below. Until VITE_SENTRY_DSN_DEV is set
          # the dev arm is empty and the wrapper no-ops, which matches the
          # behaviour dev has today.
          VITE_SENTRY_DSN: ${{ github.ref_name == 'prod' && vars.VITE_SENTRY_DSN_PROD || vars.VITE_SENTRY_DSN_DEV }}
          # Tags the env in Sentry so dev/prod errors don't pile up together.
          # import.meta.env.MODE/DEV is "production"/false during `vite build`
          # of either branch, so we derive it from the workflow ref instead.
          VITE_DEPLOY_ENV: ${{ steps.env_label.outputs.label }}
          # Sign-up form OFF on every branch (DL-0429). The v2 onboarding
          # flow (VITE_ONBOARDING_V2, served at /onboarding) is now the
          # account-creation path on dev. The /auth password sign-up form
          # dead-ends while v2 is on: the Confirm-signup email carries a
          # 6-digit code, not a link, so a form submit sits waiting on a
          # verifyOtp the form never runs. Turning the flag off sends dev
          # testers to the "Private beta" gate instead of a dead form.
          # The AuthScreen `SIGNUP_OPEN` constant reads
          # `import.meta.env.VITE_DEV_SIGNUP_OPEN === "1"`; an empty value
          # keeps the flag-on branch out of every bundle, prod included.
          # Current value is an unconditional empty string on every branch
          # (not a ternary). Re-enable on dev by changing to a ternary:
          # github.ref_name == 'dev' && '1' || ''.
          VITE_DEV_SIGNUP_OPEN: ""
          # Serve the v2 onboarding flow (DL-0429) ONLY on the dev branch
          # deploy. `ONBOARDING_V2_ENABLED` in
          # src/features/onboarding/onboarding-flow.tsx reads
          # `import.meta.env.VITE_ONBOARDING_V2 === "true"`, and
          # `beforeLoad` in src/routes/onboarding.tsx redirects /onboarding
          # to /auth when it is false.
          #
          # Without this line the variable is simply absent from the build,
          # Vite folds the compare to a constant false, and the guard
          # compiles to an UNCONDITIONAL redirect. That is exactly what the
          # dev bundle shipped after the flow merged: the screens were in
          # the bundle and the route could not be reached by anyone.
          # A Cloudflare Pages environment variable cannot substitute for
          # this, for the same reason spelled out on VITE_SENTRY_DSN above.
          #
          # Branch-derived rather than repo-variable, matching
          # VITE_DEV_SIGNUP_OPEN directly above, so no env-var typo can
          # flip it by accident. The onboarding screens are ALREADY in the
          # prod bundle regardless of this flag; the variable only controls
          # whether the /onboarding route is reachable. Enabled on both dev
          # and prod as of DL-0728 (founder GO 2026-08-11).
          #
          # Flow is wired to real auth, vault generation, and recovery-kit
          # creation as of 615d1b51. Owner and removal plan for this flag
          # are recorded on DL-0728 per DEC-0295.
          VITE_ONBOARDING_V2: ${{ (github.ref_name == 'dev' || github.ref_name == 'prod') && 'true' || '' }}
          # Cloudflare Turnstile captcha widget. Build-time inlined
          # public site key; the matching SECRET key lives in the
          # Supabase Auth project config (Studio: Auth -> Bot and
          # Abuse Protection -> CAPTCHA Protection -> Provider:
          # Cloudflare Turnstile -> Secret key). Per-env keys so the
          # dev widget can authenticate against a dev Turnstile site
          # bound to orangeway.dev, and prod against a separate site
          # bound to orangeway.app. Empty value when no captcha is
          # configured for the env yet; the SPA renders no widget and
          # submits without a token. Supabase Auth must also be
          # configured to skip captcha verification in that case.
          #
          # Dev uses Cloudflare's published always-passes TEST sitekey
          # (1x00000000000000000000AA) instead of a repository variable.
          # It is a public documented value, not a secret. The widget it
          # renders issues a token with no challenge, which is what lets
          # an automated sign-in run on dev at all. The dev Auth project
          # must carry the matching always-passes secret
          # (1x0000000000000000000000000000000AA) or the server rejects
          # the test token. The test key is bound STRICTLY to the dev
          # arm: on prod the value comes only from
          # vars.TURNSTILE_SITE_KEY_PROD, so a missing or renamed prod
          # var yields an empty key and NO widget (a visible failure),
          # never a silent fall-through to the always-passes test key
          # that would let every bot through. Triggers are push to dev or
          # prod only, so no preview build depends on the old fallback.
          VITE_TURNSTILE_SITE_KEY: ${{ github.ref_name == 'dev' && '1x00000000000000000000AA' || vars.TURNSTILE_SITE_KEY_PROD }}
          # Release identifier -- paired with the source map upload step below
          # so Sentry can resolve minified prod stack traces ("index-XYZ.js:1457:52434")
          # back to readable filenames + line numbers from our checked-in source.
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Per-environment Orange Rails Connect widget URL, baked in at
          # build time.
          #
          # BOTH values must name a host that serves the widget directly.
          # The apex orangerails.com/connect does NOT: it redirects to
          # connect.orangerails.com, so the widget posts its completion
          # message from an origin that never equals
          # `new URL(OR_CONNECT_BASE).origin` in src/lib/or/widget.ts.
          # That compare is strict and drops the message with no error.
          #
          # Prod must be set explicitly and must NOT be left empty. An
          # empty string is not nullish, so the `??` fallback in
          # widget.ts does not fire: the base becomes "" and
          # `new URL("")` throws. Verified by building both shapes and
          # reading the emitted bundle.
          VITE_OR_CONNECT_URL: ${{ github.ref_name == 'prod' && 'https://connect.orangerails.com/connect' || 'https://dev.orangerails.com/connect' }}
          # Per-environment Orange Rails platform slug, baked in at build
          # time. OR is a separate deployment per environment, so the two
          # environments authenticate as two different platform rows and
          # the slug has to follow.
          #
          # It MUST name the same platform this environment's
          # OR_PLATFORM_API_KEY authenticates as. The widget token is
          # minted through ow-or-proxy, which sends the key, so OR records
          # the session under the KEY's platform; the browser then claims
          # that session by this SLUG with no key. Name two different
          # platforms and the claim never matches its own session row, and
          # the flow dies at discovery with a 401 that blames the widget
          # token instead.
          #
          # BOTH arms are explicit on purpose. An empty arm is not unset:
          # widget.ts treats "" as unset and takes its `||` fallback, which
          # would name the prod platform from a dev build.
          VITE_OR_PLATFORM_SLUG: ${{ github.ref_name == 'prod' && 'orangeway-me' || 'orangeway-me-dev' }}
          # Gate the Orange Rails stealth-sync connector to the environments
          # where it is actually provisioned. Dev and prod as of DL-0347.
          #
          # OR_CONNECT_ENABLED in src/components/connections/ConnectionsPage.tsx
          # reads `import.meta.env.VITE_OR_CONNECT_ENABLED === "true"`. Branch
          # derived rather than a repo variable, same shape and reasoning as
          # VITE_ONBOARDING_V2 above: an unset value folds the compare to a
          # constant false, so a build that forgets the flag ships dark rather
          # than shipping a half-wired button.
          #
          # A 200 from VITE_OR_CONNECT_URL is a liveness check on the HOST and
          # is NOT proof the connector is provisioned for the prod platform
          # slug (orangeway-me). It never was. Do not re-derive the flip from
          # a 200.
          #
          # What does justify the prod arm, stated as the requirements this
          # flag rests on rather than as a description of anyone else's
          # systems. The supporting detail is in the ticket, because this
          # file is public:
          #   - The prod arm rests on a written confirmation, obtained
          #     2026-08-16 from the owner of the upstream platform registry,
          #     that the production platform this app authenticates as is
          #     live. Read it in the ticket before changing this line.
          #   - The entry point fails CLOSED if that platform is not
          #     recognised upstream: the flow stops at discovery on a
          #     visible button rather than degrading quietly. That is why a
          #     residual doubt about the confirmation is survivable here and
          #     would not be survivable on a silent path.
          #   - Do not go looking for a separate per-connector enablement
          #     switch to turn on. There is not one to find, and the answer
          #     to why is in the ticket.
          #
          # VITE_OR_PLATFORM_SLUG above already selects orangeway-me on prod
          # and orangeway-me-dev elsewhere, on BOTH branches, so this change
          # does not alter which slug is sent. It only decides whether the
          # entry point is reachable.
          #
          # The button this ungates opens the searchable source list, over 100
          # entries. It is not a tile grid and it is not new: DL-1116, PR 275.
          VITE_OR_CONNECT_ENABLED: ${{ (github.ref_name == 'dev' || github.ref_name == 'prod') && 'true' || '' }}
          # Stealth sync entry (DL-1047): Sync on a private connection opens
          # the Orange Rails widget on its sync route instead of calling
          # or-sync, which cannot see that row and honestly returns zero.
          #
          # The old prod arm stayed dark because "nobody has yet watched a
          # scan complete end to end for a host-app user". Somebody has,
          # 2026-08-16. That precondition is met. Measurements live in the
          # ticket, not here: they profile a partner's infrastructure and
          # this is a public file.
          #
          # Two requirements the reviewer must hold, stated as requirements
          # rather than as a description of what currently breaks, for the
          # same reason:
          #
          #   1. This flag must not evaluate true on the prod branch before
          #      the upstream read path in DL-1174 has landed.
          #   2. The retry-behaviour copy from PR 278 must be in before the
          #      flip, so the UI does not promise something unobserved.
          #
          # Both are now satisfied, which is why the prod arm is on:
          #   1. The DL-1174 read path reaches prod in the same promotion that
          #      carries this line, so the flag can never evaluate true on a
          #      prod build that lacks it. Same deploy, not flag first.
          #   2. PR 278 merged 2026-08-16 and its merge commit is an ancestor
          #      of prod, verified with `git merge-base --is-ancestor`.
          #
          # What the dark arm actually did, measured on prod 2026-08-18: Sync
          # on a private connection issued one request, the proxy answered 400
          # "stealth connections cannot be synced via this endpoint", and the
          # page showed the customer nothing at all -- no error, no state
          # change, the card stayed "Never synced" indefinitely. The comment
          # above calls that fallthrough an "honest no-op". It is not honest;
          # it is a dead button. The silent-failure half is a real defect and
          # is filed separately, because it will still be wrong for any future
          # connection kind the proxy rejects, flag or no flag.
          #
          # Same shape as VITE_OR_CONNECT_ENABLED above: src/lib/stealth/flags.ts
          # reads `import.meta.env.VITE_STEALTH_SYNC_ENABLED === "true"`, so an
          # unset value folds the compare to a constant false.
          VITE_STEALTH_SYNC_ENABLED: ${{ (github.ref_name == 'dev' || github.ref_name == 'prod') && 'true' || '' }}

      - name: Apply CSP policy for this branch
        # public/_headers is the single source and ships Report-Only; vite
        # copies it verbatim to dist/_headers. On dev only, flip the header
        # NAME up to enforcing IN PLACE, touching no other character of the
        # policy body, so there is no second file to drift against. prod keeps
        # the Report-Only default; an unknown branch fails loudly. If this step
        # is skipped or fails, dist/_headers stays Report-Only, so the residual
        # failure is a missing report on dev, never a vault lockout on prod.
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            dev)
              # Anchored to the header value line (two leading spaces) so the
              # header names written in the comment block never match. Require
              # EXACTLY one Report-Only header: zero or more than one is a
              # malformed source, so refuse rather than guess.
              count=$(grep -cE '^  Content-Security-Policy-Report-Only: ' dist/_headers || true)
              if [ "$count" -ne 1 ]; then
                echo "CSP: expected exactly 1 Report-Only header in dist/_headers, found $count"
                exit 1
              fi
              # Flip the NAME only. The policy body is left byte-for-byte intact.
              sed -i 's/^  Content-Security-Policy-Report-Only: /  Content-Security-Policy: /' dist/_headers
              if ! grep -qE '^  Content-Security-Policy: ' dist/_headers; then
                echo "CSP: enforcing header not present after flip"; exit 1
              fi
              if grep -qE '^  Content-Security-Policy-Report-Only: ' dist/_headers; then
                echo "CSP: Report-Only header still present after flip"; exit 1
              fi
              echo "CSP: branch=dev, header=Content-Security-Policy (enforcing)"
              ;;
            prod)
              # prod keeps the Report-Only default, but "keep" must be
              # asserted, not assumed: the policy only reaches prod because
              # the build copies public/_headers into dist/. Verify the copy
              # happened and is the shape we expect, or fail the deploy.
              if [ ! -f dist/_headers ]; then
                echo "CSP: dist/_headers missing on prod, refusing to deploy with no policy"
                exit 1
              fi
              ro_count=$(grep -cE '^  Content-Security-Policy-Report-Only: ' dist/_headers || true)
              if [ "$ro_count" -ne 1 ]; then
                echo "CSP: expected exactly 1 Report-Only header in dist/_headers on prod, found $ro_count"
                exit 1
              fi
              enf_count=$(grep -cE '^  Content-Security-Policy: ' dist/_headers || true)
              if [ "$enf_count" -ne 0 ]; then
                echo "CSP: enforcing header must not be present on prod, found $enf_count"
                exit 1
              fi
              echo "CSP: branch=prod, header=Content-Security-Policy-Report-Only (Report-Only default kept, asserted)"
              ;;
            *)
              echo "CSP: unknown branch '${{ github.ref_name }}', refusing to guess"
              exit 1
              ;;
          esac

      - name: Upload source maps to GlitchTip
        # Skip when the DSN for THIS branch is unset (open-source contributors
        # building dist locally don't need to upload anywhere, and a dev build
        # before VITE_SENTRY_DSN_DEV exists has nowhere to send maps). The run
        # block below also skips when the auth token isn't configured --
        # checking secrets.* in an `if:` expression is what made the whole
        # workflow fail validation in 0s on previous attempts, so we keep the
        # gate purely on vars.* here.
        if: ${{ (github.ref_name == 'prod' && vars.VITE_SENTRY_DSN_PROD != '') || (github.ref_name != 'prod' && vars.VITE_SENTRY_DSN_DEV != '') }}
        env:
          # GlitchTip is Sentry-protocol-compatible; sentry-cli talks to it
          # natively when SENTRY_URL points at the self-hosted instance.
          # SENTRY_URL is sourced from repo vars rather than hardcoded so
          # the source-map upload destination can be rotated without a
          # workflow edit. Fallback is the production URL.
          SENTRY_URL: ${{ vars.SENTRY_URL != '' && vars.SENTRY_URL || 'https://pulse.orangeway.app' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_ORG || 'orangeway' }}
          # Branch derived, same shape as VITE_OR_PLATFORM_SLUG above. These
          # are the two project slugs that actually exist on the GlitchTip
          # side, so the upload cannot be pointed at a project that is not
          # there by a stale repository variable.
          SENTRY_PROJECT: ${{ github.ref_name == 'prod' && 'orange-way-me' || 'orange-way-me-dev' }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "GLITCHTIP_API_TOKEN not set in repo/env secrets -- skipping source-map upload."
            exit 0
          fi
          # Install sentry-cli to a temp dir so we don't touch /usr (no sudo needed).
          curl -sL https://sentry.io/get-cli/ | INSTALL_DIR=/tmp/sentry-cli-bin bash
          export PATH="/tmp/sentry-cli-bin:$PATH"

          # Register the release on the GlitchTip side.
          sentry-cli releases new "$RELEASE"

          # Inject debug-ids into the built JS + .map files so the SDK can find
          # the right map for a given stack frame without needing sourceMappingURL
          # comments (vite.config.ts sets sourcemap: 'hidden').
          sentry-cli sourcemaps inject ./dist

          # Upload both .js and .js.map files. --strip-prefix drops the runner's
          # absolute build path so the displayed filename in GlitchTip is "src/..."
          # not "/home/runner/work/orange-way/orange-way/src/...".
          sentry-cli sourcemaps upload \
            --release "$RELEASE" \
            --strip-prefix "$GITHUB_WORKSPACE" \
            ./dist

          # Tie the release to the deploying commit (best-effort) and finalize.
          sentry-cli releases set-commits --auto "$RELEASE" || true
          sentry-cli releases finalize "$RELEASE"

      - name: Pick Pages project for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project=ow-prod" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://orangeway.app" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "project=ow-dev" >> "$GITHUB_OUTPUT"
            echo "verify_url=https://orangeway.dev" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} -- skipping deploy"
            exit 0
          fi

      - name: Deploy to ${{ steps.target.outputs.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4.92.0 pages deploy dist \
            --project-name=${{ steps.target.outputs.project }} \
            --branch=${{ github.ref_name }} \
            --commit-dirty=true

      - name: Verify deploy
        run: |
          sleep 8
          ROUTES=$(curl -s ${{ steps.target.outputs.verify_url }} | grep -oE '/assets/routes-[^"]*\.js' | head -1 || true)
          if [ -z "$ROUTES" ]; then
            echo "::warning::Could not find routes chunk on ${{ steps.target.outputs.verify_url }}"
            exit 0
          fi
          curl -s "${{ steps.target.outputs.verify_url }}${ROUTES}" >/dev/null
          echo "checkmark ${{ steps.target.outputs.verify_url }} routes chunk fetched OK"

      # E2E smoke against the freshly-deployed environment. Chromium
      # only on every push so deploys stay fast; the Firefox / WebKit
      # / mobile projects in playwright.config.ts run locally (and in
      # a future nightly matrix workflow). Tests stub /api/signup
      # internally, so this step does NOT actually call Resend.
      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Playwright smoke + marketing-form interaction
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.verify_url }}
        run: bunx playwright test --project=chromium --reporter=list

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.ref_name }}
          path: playwright-report/
          retention-days: 7
