name: Credential health check

# Daily check that SUPABASE_ACCESS_TOKEN is valid in each environment.
# Why this exists: on 2026-09-16 CI failed on 6 checks because
# SUPABASE_ACCESS_TOKEN was revoked in the dev environment with no
# prior alert. This workflow detects the failure a day in advance.
#
# Design:
#   1. Proven-failure guard: probe with a hardcoded invalid token and
#      assert the API returns non-200. If it somehow returns 200 the
#      guard fails the job rather than producing a false green.
#   2. Real token probe: curl -s the Supabase projects API and exit 1
#      if the token is empty or the response is not 200.
#   3. On failure: POST a Zulip message to stream "Orange Way",
#      topic "CI credential alert (OW-E0002)".
#
# Required GitHub secrets (in BOTH dev and prod environment scopes):
#   SUPABASE_ACCESS_TOKEN   - Supabase management API personal access token
#   ZULIP_BOT_EMAIL         - Zulip bot e-mail (e.g. ci-bot@waggle.orangeway.dev)
#   ZULIP_BOT_API_KEY       - Zulip bot API key

on:
  schedule:
    # 08:00 UTC daily - early enough to catch a problem before the working day
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test (dev, prod, or both)'
        required: false
        default: 'both'

permissions:
  contents: read

jobs:
  check-dev:
    name: Check SUPABASE_ACCESS_TOKEN (dev)
    runs-on: ubuntu-latest
    environment: dev
    # Skip if workflow_dispatch asks for prod only
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == 'both'
    steps:
      - name: Proven-failure guard
        # Probe the API with a known-bad token first.
        # If the API returns 200 for an invalid token, something is wrong
        # with the probe itself and we must not trust the real check.
        run: |
          set -euo pipefail
          PROBE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer invalid-token-test" \
            https://api.supabase.com/v1/projects)
          echo "Proven-failure probe returned HTTP ${PROBE_CODE}"
          if [ "$PROBE_CODE" = "200" ]; then
            echo "::error::Proven-failure guard failed: the Supabase API returned 200 for a known-invalid token. The probe logic is broken and cannot be trusted. Fix the probe before treating any result as meaningful."
            exit 1
          fi
          echo "Proven-failure guard passed: API correctly rejected the invalid token (HTTP ${PROBE_CODE})."

      - name: Check SUPABASE_ACCESS_TOKEN is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty or not set in the dev environment. Regenerate it at https://supabase.com/dashboard/account/tokens and update the GitHub environment secret."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is set (length: ${#SUPABASE_ACCESS_TOKEN})."

      - name: Probe Supabase API (dev)
        id: probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            https://api.supabase.com/v1/projects)
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          echo "Supabase API responded with HTTP ${HTTP_CODE} for dev token."
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is invalid or expired in the dev environment (HTTP ${HTTP_CODE}). Regenerate it at https://supabase.com/dashboard/account/tokens and update the GitHub environment secret."
            exit 1
          fi
          echo "Dev SUPABASE_ACCESS_TOKEN is healthy."

      - name: Alert Zulip on failure (dev)
        if: failure()
        env:
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE="${{ steps.probe.outputs.http_code }}"
          if [ -z "${HTTP_CODE}" ]; then
            REASON="token is empty or not set"
          else
            REASON="API returned HTTP ${HTTP_CODE} (expected 200)"
          fi
          MESSAGE="**SUPABASE_ACCESS_TOKEN invalid in dev environment** -- ${REASON}. Regenerate at https://supabase.com/dashboard/account/tokens and update the GitHub Actions secret. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s --fail -X POST https://waggle.orangeway.dev/api/v1/messages \
            -u "${ZULIP_BOT_EMAIL}:${ZULIP_BOT_API_KEY}" \
            -A "ZulipPython/0.9.0" \
            -d "type=stream" \
            -d "to=Orange Way" \
            --data-urlencode "topic=CI credential alert (OW-E0002)" \
            --data-urlencode "content=${MESSAGE}"

  check-prod:
    name: Check SUPABASE_ACCESS_TOKEN (prod)
    runs-on: ubuntu-latest
    environment: prod
    # Skip if workflow_dispatch asks for dev only
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.environment == 'prod' ||
      github.event.inputs.environment == 'both'
    steps:
      - name: Proven-failure guard
        run: |
          set -euo pipefail
          PROBE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer invalid-token-test" \
            https://api.supabase.com/v1/projects)
          echo "Proven-failure probe returned HTTP ${PROBE_CODE}"
          if [ "$PROBE_CODE" = "200" ]; then
            echo "::error::Proven-failure guard failed: the Supabase API returned 200 for a known-invalid token. The probe logic is broken and cannot be trusted."
            exit 1
          fi
          echo "Proven-failure guard passed: API correctly rejected the invalid token (HTTP ${PROBE_CODE})."

      - name: Check SUPABASE_ACCESS_TOKEN is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty or not set in the prod environment. Regenerate it at https://supabase.com/dashboard/account/tokens and update the GitHub environment secret."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is set (length: ${#SUPABASE_ACCESS_TOKEN})."

      - name: Probe Supabase API (prod)
        id: probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            https://api.supabase.com/v1/projects)
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          echo "Supabase API responded with HTTP ${HTTP_CODE} for prod token."
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is invalid or expired in the prod environment (HTTP ${HTTP_CODE}). Regenerate it at https://supabase.com/dashboard/account/tokens and update the GitHub environment secret."
            exit 1
          fi
          echo "Prod SUPABASE_ACCESS_TOKEN is healthy."

      - name: Alert Zulip on failure (prod)
        if: failure()
        env:
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE="${{ steps.probe.outputs.http_code }}"
          if [ -z "${HTTP_CODE}" ]; then
            REASON="token is empty or not set"
          else
            REASON="API returned HTTP ${HTTP_CODE} (expected 200)"
          fi
          MESSAGE="**SUPABASE_ACCESS_TOKEN invalid in prod environment** -- ${REASON}. Regenerate at https://supabase.com/dashboard/account/tokens and update the GitHub Actions secret. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s --fail -X POST https://waggle.orangeway.dev/api/v1/messages \
            -u "${ZULIP_BOT_EMAIL}:${ZULIP_BOT_API_KEY}" \
            -A "ZulipPython/0.9.0" \
            -d "type=stream" \
            -d "to=Orange Way" \
            --data-urlencode "topic=CI credential alert (OW-E0002)" \
            --data-urlencode "content=${MESSAGE}"
