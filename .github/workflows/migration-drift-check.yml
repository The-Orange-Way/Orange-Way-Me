name: Migration drift check

# Merging a migration PR ships the FILES and redeploys the APP. Nothing in
# .github/** runs the DDL. So a migration can be merged and never applied,
# with every check green. This workflow is the thing that compares the two.
#
# It is deliberately NOT a step inside deploy-supabase-functions.yml. It has
# to run whether or not that deploy succeeded, and a drift failure must never
# be confusable with a deploy failure.

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
  schedule:
    # Daily at 13:17 UTC (09:17 EDT). A scheduled run always fires on the
    # default branch, so the branch to compare is chosen explicitly below
    # rather than taken from github.ref_name, which would silently compare
    # dev's files against dev's database and never look at prod at all.
    - cron: '17 13 * * *'

# Read access to the checkout is the whole requirement. The comparison
# authenticates to Supabase with the environment scoped access token and
# writes no GitHub state of its own.
permissions:
  contents: read

concurrency:
  group: migration-drift-${{ github.event_name == 'schedule' && 'prod' || github.ref_name }}
  cancel-in-progress: false

jobs:
  drift:
    name: Compare migration files against the database ledger
    runs-on: ubuntu-latest
    # Binds to the GitHub Environment named for the branch being compared.
    # Each environment defines its OWN SUPABASE_ACCESS_TOKEN, so a dev run
    # never has the prod credential in scope. A scheduled run
    # targets prod, because prod is the environment where an unapplied
    # migration actually costs something.
    environment: ${{ github.event_name == 'schedule' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'prod' || github.ref_name }}

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Pick the branch and project ref to compare
        id: target
        # The branch name reaches the shell through this mapping rather than
        # being interpolated into the script text, so the runner never rewrites
        # the body of the script with a value taken from a ref name.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            BRANCH=prod
          else
            BRANCH="$REF_NAME"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "prod" ]; then
            echo "ref=tmqjusxxjjcsdgyiqbcg" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "ref=bogmoovbjpvcvdqrmjgt" >> "$GITHUB_OUTPUT"
          else
            echo "No project is mapped for branch $BRANCH"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
          REF: ${{ steps.target.outputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # An empty ref means no project is mapped for this branch. Whether
          # that is acceptable depends on HOW the run started: a manual run off
          # a feature branch legitimately has no target, but a push to dev or
          # prod with no mapping means the comparison did not happen while the
          # job goes green. That case must go RED.
          if [ -z "${REF:-}" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No project ref for $BRANCH: nothing was compared (manual run off a branch that is neither dev nor prod)." >&2
              exit 0
            fi
            echo "No project ref for $BRANCH on a $EVENT_NAME event: the comparison did not happen. Failing loudly." >&2
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set for the $BRANCH environment: cannot read the database ledger." >&2
            exit 1
          fi

          # LOCAL: the version prefix of every migration file on this branch.
          if ! ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "No migration files under supabase/migrations. Refusing to report 'no drift' out of an empty checkout." >&2
            exit 1
          fi
          basename -a supabase/migrations/*.sql | sort -u > local_files.txt
          # sort -u collapses two files that share one 14-digit prefix into a
          # single entry. That is deliberate, not a blind spot: the ledger holds
          # ONE row per version, so a duplicate prefix cannot be compared as two
          # in the first place, and the Migration filename hygiene job in ci.yml
          # refuses any NEW duplicate before it can merge.
          sed -nE 's/^([0-9]{14}).*/\1/p' local_files.txt | sort -u > local.txt
          # A filename that does not begin with a 14-digit version is dropped by
          # the parse above and never reaches the comparison at all. The guard
          # below only fires when EVERY name is dropped, so a single misnamed
          # file would be invisible in exactly the way an unreadable ledger cell
          # is. Collect the names here and report them at the END of the run.
          # Deliberately not an early exit: this runs before the CLI call, and
          # the first real run of this workflow is what settles whether the
          # access token alone can read the ledger. A filename must not be what
          # stops us finding that out.
          # grep exits 1 when nothing matches, which is the normal healthy case
          # and must not fail the run under set -e. Anything above 1 is a real
          # grep error, and swallowing that alongside the expected 1 would leave
          # local_bad.txt empty and the report at the end of this run silent.
          set +e
          grep -vE '^[0-9]{14}' local_files.txt > local_bad.txt
          GREP_STATUS=$?
          set -e
          if [ "$GREP_STATUS" -gt 1 ]; then
            echo "grep exited $GREP_STATUS while listing migration filenames that do not begin with a 14-digit version. That is a grep failure, not an empty result, so nothing below it can be trusted." >&2
            exit 1
          fi
          if [ ! -s local.txt ]; then
            echo "Parsed zero versions out of the migration filenames. The naming convention changed and this check can no longer tell drift from silence." >&2
            exit 1
          fi

          # REMOTE: what the database ledger says is applied.
          # This is also the open question this check answers on its first real
          # run: whether the CLI is satisfied by the access token alone or wants
          # a database password. If it wants one, this fails and says so.
          if ! supabase migration list --project-ref "$REF" > list.txt 2> list.err; then
            echo "supabase migration list FAILED against $REF. If the error below asks for a database password, the access token alone is not sufficient and the shape of this check has to be revisited." >&2
            cat list.err >&2
            exit 1
          fi
          echo "--- supabase migration list --project-ref $REF ---"
          cat list.txt
          echo "--- end ---"

          # Find the REMOTE column by its header rather than by a fixed index,
          # so a leading pipe or a reordered table does not silently shift which
          # column is read. If the header is not found, remote.txt stays empty
          # and the guard below fails the run.
          rm -f remote_bad.txt
          awk -F'|' '
            BEGIN { ri = 0 }
            {
              for (i = 1; i <= NF; i++) { f = $i; gsub(/^[ \t]+|[ \t]+$/, "", f); c[i] = f }
              if (ri == 0) { for (i = 1; i <= NF; i++) if (toupper(c[i]) == "REMOTE") ri = i; next }
              if (ri > NF) next
              v = c[ri]
              # A blank REMOTE cell is the CLI stating that this version is not
              # applied. That is real data, and the comparison below reports it.
              if (v == "") next
              # Table border rows are decoration, never data.
              if (v ~ /^[-+= ]+$/) next
              if (v ~ /^[0-9]{14}$/) { print v; next }
              # Anything else is a REMOTE value we could not read. Do NOT drop
              # it. A ledger entry that is not a 14-digit version is the
              # fingerprint of a hand-written schema_migrations row, which is
              # the exact fault this check exists to surface.
              print v > "remote_bad.txt"
            }' list.txt | sort -u > remote.txt

          # Reported before the comparison, not alongside it. A ledger read that
          # is only partly parsed would show genuinely applied versions as
          # unapplied, so drift output computed over it is misleading rather
          # than merely incomplete. Separate message from both drift directions.
          if [ -s remote_bad.txt ]; then
            echo "UNREADABLE LEDGER VALUES: the CLI reported REMOTE entries that are not 14-digit versions. A hand-written schema_migrations row is the usual cause. Nothing is compared while these are unread. Offending values:" >&2
            sort -u remote_bad.txt >&2
            exit 1
          fi

          if [ ! -s remote.txt ]; then
            echo "Parsed zero applied versions out of the CLI output above. Either the ledger is genuinely empty or the output format changed. Both go RED on purpose: an unparseable table read as 'no drift' is exactly the silent success this check exists to catch." >&2
            exit 1
          fi

          echo "branch=$BRANCH project=$REF local=$(wc -l < local.txt) remote=$(wc -l < remote.txt) local_unparsed=$(wc -l < local_bad.txt)"

          UNAPPLIED="$(comm -23 local.txt remote.txt)"
          UNTRACKED="$(comm -13 local.txt remote.txt)"

          STATUS=0
          if [ -n "$UNAPPLIED" ]; then
            echo "DRIFT: migration files on $BRANCH that the database has NOT applied:" >&2
            echo "$UNAPPLIED" >&2
            STATUS=1
          fi
          if [ -n "$UNTRACKED" ]; then
            echo "DRIFT: versions the database reports applied with no matching file on $BRANCH:" >&2
            echo "$UNTRACKED" >&2
            STATUS=1
          fi
          if [ -s local_bad.txt ]; then
            echo "NOT COMPARED: migration files on $BRANCH whose name does not begin with a 14-digit version. These were excluded from every count above, so the comparison is incomplete until they are renamed:" >&2
            cat local_bad.txt >&2
            STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "No drift: every migration file on $BRANCH is recorded in the database, and the database records nothing extra."
          fi
          exit "$STATUS"
