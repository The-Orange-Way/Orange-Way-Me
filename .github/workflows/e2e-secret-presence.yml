name: E2E secret presence probe

# TEMPORARY. Scaffolding for one measurement, deleted in this same
# branch once the result is recorded. See the commit message.
#
# Prints true or false only. The secret value is never interpolated:
# GitHub evaluates `secrets.X != ''` itself and substitutes the boolean
# literal, so nothing sensitive reaches the log.

on:
  push:
    branches:
      - feat/owm-t0164-authenticated-ci

permissions:
  contents: read

jobs:
  e2e-user-email-present:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_USER_EMAIL configured
        run: |
          present="${{ secrets.E2E_USER_EMAIL != '' }}"
          echo "E2E_USER_EMAIL present: ${present}"
          [ "${present}" = "true" ]

  e2e-user-password-present:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_USER_PASSWORD configured
        run: |
          present="${{ secrets.E2E_USER_PASSWORD != '' }}"
          echo "E2E_USER_PASSWORD present: ${present}"
          [ "${present}" = "true" ]

  e2e-vault-password-present:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_VAULT_PASSWORD configured
        run: |
          present="${{ secrets.E2E_VAULT_PASSWORD != '' }}"
          echo "E2E_VAULT_PASSWORD present: ${present}"
          [ "${present}" = "true" ]
