name: E2E secret presence probe

# TEMPORARY. Scaffolding for one measurement, deleted in this same
# branch once the result is recorded. See the commit messages.
#
# Prints true or false only. The secret value is never interpolated:
# GitHub evaluates `secrets.X != ''` itself and substitutes the boolean
# literal, so nothing sensitive reaches the log.
#
# Two scopes are probed because they are different scopes, and only one
# of them is the one deploy.yml reads from:
#
#   repo-*  jobs declare no environment, so they see repository secrets
#           only.
#   env-*   jobs declare `environment: dev`, which is what deploy.yml's
#           build-and-deploy job resolves to on the dev branch
#           (deploy.yml line 38, `environment: ${{ github.ref_name }}`).
#           Environment secrets are invisible to any job that does not
#           declare the environment.
#
# env-control asserts nothing. It exists so an env-* failure can be
# read: if the control passes, the environment is reachable from this
# branch and a failing sibling means the secret is genuinely absent. If
# the control also fails, a deployment-branch policy is refusing this
# branch the environment and NOTHING has been learned about the
# secrets.

on:
  push:
    branches:
      - feat/owm-t0164-authenticated-ci

permissions:
  contents: read

jobs:
  repo-e2e-user-email:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_USER_EMAIL configured as a repository secret
        run: |
          present="${{ secrets.E2E_USER_EMAIL != '' }}"
          echo "repo scope, E2E_USER_EMAIL present: ${present}"
          [ "${present}" = "true" ]

  repo-e2e-user-password:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_USER_PASSWORD configured as a repository secret
        run: |
          present="${{ secrets.E2E_USER_PASSWORD != '' }}"
          echo "repo scope, E2E_USER_PASSWORD present: ${present}"
          [ "${present}" = "true" ]

  repo-e2e-vault-password:
    runs-on: ubuntu-latest
    steps:
      - name: E2E_VAULT_PASSWORD configured as a repository secret
        run: |
          present="${{ secrets.E2E_VAULT_PASSWORD != '' }}"
          echo "repo scope, E2E_VAULT_PASSWORD present: ${present}"
          [ "${present}" = "true" ]

  env-control:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: dev environment is reachable from this branch
        run: echo "reached the dev environment; this job asserts nothing else"

  env-e2e-user-email:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: E2E_USER_EMAIL configured in the dev environment
        run: |
          present="${{ secrets.E2E_USER_EMAIL != '' }}"
          echo "dev environment scope, E2E_USER_EMAIL present: ${present}"
          [ "${present}" = "true" ]

  env-e2e-user-password:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: E2E_USER_PASSWORD configured in the dev environment
        run: |
          present="${{ secrets.E2E_USER_PASSWORD != '' }}"
          echo "dev environment scope, E2E_USER_PASSWORD present: ${present}"
          [ "${present}" = "true" ]

  env-e2e-vault-password:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: E2E_VAULT_PASSWORD configured in the dev environment
        run: |
          present="${{ secrets.E2E_VAULT_PASSWORD != '' }}"
          echo "dev environment scope, E2E_VAULT_PASSWORD present: ${present}"
          [ "${present}" = "true" ]
