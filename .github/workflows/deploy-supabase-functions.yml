name: Deploy Supabase edge functions

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

# Unlike the Pages deploy (see .github/workflows/deploy.yml lines 8-25), edge
# functions apply per function and incrementally: cancelling a run mid deploy
# can leave some functions updated and others not, a silent partial state. So
# cancel-in-progress MUST be false here. Do not harmonise it with the Pages
# workflow: the two ship different kinds of artifact and the correct answer
# differs. Runs are serialised per branch instead, so a newer push waits for
# the older one to finish rather than cancelling it.
concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

# Least privilege for the automatic GITHUB_TOKEN. The deploy authenticates to
# Supabase with SUPABASE_ACCESS_TOKEN from secrets and writes no GitHub state
# of its own, so read access to the checkout is the whole requirement. Matches
# the Pages deploy workflow.
permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pick project ref for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "ref=tmqjusxxjjcsdgyiqbcg" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "ref=bogmoovbjpvcvdqrmjgt" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} -- skipping functions deploy"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # A deploy step that cannot do its job must FAIL, not skip: a green
          # run that deployed nothing is the silent-success shape (DL-1082).
          # Checking secrets.* in an if: expression fails workflow validation
          # in 0s (see the GlitchTip step in deploy.yml), so the gate lives
          # here in the run block. The SUPABASE_ACCESS_TOKEN repo secret must
          # be set BEFORE this lands, or every push to dev and prod goes red.
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not set -- cannot deploy edge functions." >&2
            exit 1
          fi
          REF="${{ steps.target.outputs.ref }}"
          # An empty REF means no project is mapped for this branch. Whether that
          # is fine depends on HOW the run started (DL-1082, CTO ruling on #262):
          # a manual workflow_dispatch off dev/prod legitimately has no target and
          # skips; a push to dev or prod with no mapping means the deploy did not
          # happen while the job goes green, the silent-success shape that produced
          # DL-1079. That case must go RED.
          if [ -z "$REF" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "No project ref for ${{ github.ref_name }} -- no deploy was performed (manual run off dev/prod)." >&2
              exit 0
            fi
            echo "No project ref for ${{ github.ref_name }} on a ${{ github.event_name }} event -- deploy did not happen. Failing loudly." >&2
            exit 1
          fi
          # Deploys every function under supabase/functions, honouring the
          # per-function verify_jwt settings in supabase/config.toml. Source
          # becomes the single source of truth for what is live, instead of
          # the edge drifting from the repo (DL-1079).
          supabase functions deploy --project-ref "$REF"
