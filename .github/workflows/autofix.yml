name: autofix (prettier)

# TEMPORARY. Lives only on feat/onboarding-wizard-shell and is deleted before
# the merge ask. It exists because eslint-plugin-prettier reports formatting as
# errors and no agent seat can read the raw Lint log to see the exact bytes
# prettier wants. Rather than keep guessing the wrap shape by hand, let CI run
# the same prettier the Lint job enforces and commit its deterministic output.

on:
  push:
    branches:
      - feat/onboarding-wizard-shell

# Loop guard: skip the run created by this job's own bot commit. Combined with
# GitHub not re-triggering workflows on default-token pushes, this cannot loop.
permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/onboarding-wizard-shell

      # Match CI exactly: the project is Bun (bun.lockb is the source of truth).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun run format == prettier --write . with the repo prettier config,
      # the same prettier eslint-plugin-prettier runs internally in Lint.
      - name: Prettier write
        run: bun run format

      - name: Commit prettier output if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: prettier autofix (temporary autofix workflow)"
          branch: feat/onboarding-wizard-shell
