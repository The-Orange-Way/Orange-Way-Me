name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the automatic GITHUB_TOKEN. This job only reads the
# checkout: it opens no PR, writes no status, publishes no package. Stating
# the minimum here means a compromised step or transitive dependency cannot
# borrow write scope the repository default might otherwise grant.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project is managed with Bun (bun.lockb, bunfig.toml).
      # bun.lockb is the single source of truth for dependency versions.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        # After the 2026-05-27 cleanup the codebase has 0 eslint errors.
        # Lint now blocks merges on any new error. Warnings don't block
        # (~128 react-hooks v5 strict-rule warnings remain, slated for
        # gradual migration — see eslint.config.js for the rationale).
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test-file inventory (pre-test guard)
        # Counts every *.test.ts and *.test.tsx under src/ before running
        # vitest. Fails immediately if zero files exist -- that means the
        # include glob is wrong or the checkout is broken, not that there
        # are no tests. Saves the count for the post-test verify step.
        # Same silent-success guard pattern as migration-hygiene and deno-typecheck.
        run: |
          set -euo pipefail
          # Count every file vitest collects: src/**/*.test.{ts,tsx} plus
          # supabase/functions/**/*.test.ts -- the same two globs as vitest.config.ts.
          # Both sides of the guard must count the same set. Counting only src/ here
          # while the post-test step reads everything vitest collected (including
          # supabase/functions/) means those files can vanish silently while the
          # step still reports OK.
          SRC_COUNT=$(find src \( -name '*.test.ts' -o -name '*.test.tsx' \) | wc -l | tr -d ' ')
          FUNC_COUNT=$(find supabase/functions -name '*.test.ts' 2>/dev/null | wc -l | tr -d ' ')
          DISK=$((SRC_COUNT + FUNC_COUNT))
          if [ "$DISK" -eq 0 ]; then
            echo "::error::No test files found under src/ or supabase/functions/ -- the vitest include glob is broken or there are no tests. Fix the glob rather than let it report green."
            exit 1
          fi
          echo "Found $DISK test file(s) on disk ($SRC_COUNT under src/, $FUNC_COUNT under supabase/functions/)"
          echo "EXPECTED_TEST_FILES=$DISK" >> "$GITHUB_ENV"

      - name: Test
        run: bun run test -- --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/vitest-results.json"

      - name: Test-collection verify (post-test guard)
        # Compares the number of test SUITES vitest actually collected against
        # the file count from the inventory step. If vitest collected fewer
        # than exist on disk, the include glob is silently dropping tests.
        # This is the exact failure the widened glob in vitest.config.ts fixes,
        # and this step ensures the fix cannot silently regress.
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/vitest-results.json" ]; then
            echo "::error::vitest JSON output not found at $RUNNER_TEMP/vitest-results.json -- the test step may not have written it."
            exit 1
          fi
          COLLECTED=$(node -e "const r=require('$RUNNER_TEMP/vitest-results.json'); console.log(r.testResults ? r.testResults.length : 0)")
          if [ "$COLLECTED" -lt "$EXPECTED_TEST_FILES" ]; then
            echo "::error::Vitest collected $COLLECTED test suite(s) but $EXPECTED_TEST_FILES file(s) exist on disk. The include glob is silently dropping tests -- widen it in vitest.config.ts."
            exit 1
          fi
          echo "Test collection OK: $COLLECTED suite(s) collected, $EXPECTED_TEST_FILES file(s) on disk"

  migration-hygiene:
    name: Migration filename hygiene
    runs-on: ubuntu-latest
    # Why this job exists: two files in supabase/migrations share the version
    # prefix 20260812000000, and nothing in this repo would ever have told us.
    # CI here has never looked at supabase/migrations at all -- there is no
    # drift report and no apply step, so a duplicate version is invisible until
    # someone wonders why a migration that is plainly on disk never took.
    #
    # Why a duplicate is not cosmetic. `supabase_migrations.schema_migrations`
    # holds ONE row per version. Two files sharing a prefix means at most one of
    # them can ever be recorded, and every tool that keys on version -- the
    # applier, any future drift report -- then treats the other as done whether
    # it ran or not. The two involved here are both privilege changes
    # (reasserting an admin-only function, revoking table grants), so the
    # failure mode is a revocation that silently never happened.
    #
    # Ported from the equivalent guard in the Orange Rails deploy workflow,
    # where it lives inside the drift report because that is the check a
    # duplicate invalidates. This repo has no drift report yet, so it stands on
    # its own as a pre-merge lint: cheap, no credentials, no network.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse duplicate migration version prefixes
        run: |
          set -uo pipefail
          MIG_DIR="supabase/migrations"

          # Fail loudly rather than green when there is nothing to inspect.
          # Both no-directory and no-*.sql previously printed a success, so the
          # step could not tell "examined 59 files, none duplicated" from
          # "examined nothing because the path or the checkout is wrong". This
          # repo does have migrations, so either case is a broken job and not a
          # clean tree. Same shape as the zero-file guard in the Deno job below.
          if [ ! -d "$MIG_DIR" ]; then
            echo "::error::${MIG_DIR} does not exist -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          COUNT=$(ls "$MIG_DIR"/*.sql 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .sql files found under ${MIG_DIR} -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          # The one duplicate that predates this guard. Pinned as an exact
          # (version, sorted filenames) pair rather than as a bare version, so
          # a THIRD file landing on the same prefix still fails. Renaming one
          # of these is NOT safe to do from here: if the version is already
          # recorded in the ledger, a rename makes it pending again and the
          # body re-runs. Which file moves, and whether it needs to be a no-op
          # rewrite instead, is the DBA's call -- asked, and this entry comes
          # out in the same change that settles it.
          BASELINE_VERSION="20260812000000"
          BASELINE_FILES="20260812000000_reassert_redeem_invite_code_auth_admin_only.sql 20260812000000_revoke_invite_codes_table_grants.sql"

          DUPES=$(ls "$MIG_DIR"/*.sql 2>/dev/null | sed 's|.*/||' | cut -d_ -f1 | sort | uniq -d)

          if [ -z "$DUPES" ]; then
            echo "examined ${COUNT} migration files; no duplicate version prefixes"
            exit 0
          fi

          FAILED=0
          for V in $DUPES; do
            FILES=$(ls "$MIG_DIR"/${V}_*.sql 2>/dev/null | sed 's|.*/||' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ "$V" = "$BASELINE_VERSION" ] && [ "$FILES" = "$BASELINE_FILES" ]; then
              {
                echo "### Known duplicate migration version (baselined)"
                echo ""
                echo "\`${V}\` is shared by two files that predate this guard:"
                echo ""
                for F in $FILES; do echo "- \`${F}\`"; done
                echo ""
                echo "Not failing on this pair, because renaming one of them is a"
                echo "DBA decision: if the version is already recorded, a rename"
                echo "makes it pending again and the body re-runs. Remove this"
                echo "baseline in the change that settles it."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::known duplicate migration version ${V} (baselined, awaiting a DBA ruling)"
              continue
            fi

            FAILED=1
            {
              echo "### :rotating_light: Duplicate migration version \`${V}\`"
              echo ""
              echo "Used by more than one file:"
              echo ""
              for F in $FILES; do echo "- \`${F}\`"; done
              echo ""
              echo "\`supabase_migrations.schema_migrations\` stores one row per"
              echo "version, so at most one of these can ever be tracked and the"
              echo "rest count as applied whether they ran or not. Give the newer"
              echo "file an unused timestamp before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::duplicate migration version ${V}: ${FILES}"
          done

          if [ "$FAILED" -eq 0 ]; then
            echo "examined ${COUNT} migration files; no unbaselined duplicate version prefixes"
          fi
          exit $FAILED

  deno-typecheck:
    name: Typecheck edge functions (Deno)
    runs-on: ubuntu-latest
    # Why this job exists: until 2026-07-26 CI never looked at supabase/functions
    # at all. `bunx tsc --noEmit` above typechecks the Vite app's tsconfig
    # project, which does not include the edge functions -- they are Deno, with
    # their own globals and URL/npm: imports, and tsc never sees them. So all 14
    # functions could stop compiling with CI still fully green.
    #
    # Gate design -- read this before changing it. This is a RATCHET, not a
    # wall: it fails only when the error count goes ABOVE the recorded
    # baseline. A plain `deno check` gate would go red on day one and block
    # every open PR in the repo; a `continue-on-error: true` advisory would
    # reproduce the exact blindness this job exists to end. The ratchet does
    # neither -- new type errors cannot land, the existing backlog is printed
    # in the job summary on every run, and the number only moves down.
    #
    # Making this check REQUIRED in the branch ruleset is a FOUNDER DECISION
    # and has deliberately NOT been done here. Nothing in this PR touches
    # branch protection.
    env:
      # Errors present on dev when this job was added, measured 2026-07-26 with
      # the pinned Deno below. Lower it in the same PR that fixes errors -- the
      # job prints the new value when the count drops. At 0, delete the ratchet
      # and let `deno check` fail on its own.
      DENO_CHECK_BASELINE: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned, not `latest`. These functions run on Supabase's edge
          # runtime, which the Supabase CLI provisions as edge-runtime v1.74.2
          # == deno 2.1.4; typecheck with the tsc the runtime actually ships.
          # Do not switch this to `latest`. A newer Deno bundles a newer tsc,
          # and a newer tsc reports a different set of diagnostics on an
          # unchanged tree -- it both adds and retires error classes. The
          # baseline below would then move for reasons unrelated to our code,
          # and the ratchet would go red on a Deno release rather than on a
          # code change. Bump the pin deliberately, in its own PR, and record
          # the new count in the same commit.
          deno-version: v2.1.4

      - name: deno check supabase/functions
        shell: bash
        env:
          # Deno colourises its diagnostics even when stdout+stderr are
          # redirected to a file on the runner. The first version of this step
          # counted "[ERROR]" fine but its per-class breakdown grepped for
          # 'TS1234 [ERROR]' and matched nothing, because the real bytes are
          # 'TS1234 <ESC>[0m[ERROR]'. Under `-e -o pipefail` that zero-match
          # grep killed the step, so the job went red while reporting exactly
          # the baseline count. NO_COLOR removes the escapes at the source; the
          # sed below strips them anyway, because a parser that only works when
          # the output happens to be plain is the same class of unreliable
          # control this job exists to replace.
          NO_COLOR: '1'
        run: |
          set -u

          # Scoped to deployable edge functions only. The rest of the repo is
          # Bun/Vite and is covered by the lint-and-build job. *.test.ts is
          # excluded: colocated vitest tests run under Node/vitest, not the Deno
          # edge runtime, so deno check on them only reports unresolvable vitest
          # imports, never a real edge-runtime type error.
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f ! -name '*.test.ts' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No .ts files found under supabase/functions -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi
          echo "Checking ${#FILES[@]} file(s) with $(deno --version | head -1)"

          # --node-modules-dir=auto: the repo has a root package.json, so Deno
          # otherwise refuses npm: specifiers with "run deno install first".
          RC=0
          deno check --node-modules-dir=auto "${FILES[@]}" > "$RUNNER_TEMP/deno-check.raw" 2>&1 || RC=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deno-check.raw" > "$RUNNER_TEMP/deno-check.log"
          cat "$RUNNER_TEMP/deno-check.log"

          # One "[ERROR]" marker per diagnostic (the last is additionally
          # prefixed "error: "). Counting markers is stable; Deno's
          # "Found N errors." line is not printed when N == 1.
          ERRORS=$(grep -c '\[ERROR\]' "$RUNNER_TEMP/deno-check.log" || true)

          # A non-zero exit with no diagnostics means the check itself broke
          # (network, unresolvable import, bad flag). That must never be scored
          # as "0 errors, under baseline, pass" -- a check that silently stops
          # checking is the precise failure this job exists to eliminate.
          if [ "$RC" -ne 0 ] && [ "$ERRORS" -eq 0 ]; then
            echo "::error::deno check exited $RC without reporting any type diagnostic. The check is broken, not passing."
            exit 1
          fi

          {
            echo "## Deno typecheck: supabase/functions"
            echo
            echo "**${ERRORS} error(s)** across ${#FILES[@]} file(s) (ratchet baseline: ${DENO_CHECK_BASELINE})"
            if [ "$ERRORS" -gt 0 ]; then
              echo
              echo "By error class:"
              echo '```'
              grep -oE 'TS[0-9]+ \[ERROR\]' "$RUNNER_TEMP/deno-check.log" | sort | uniq -c | sort -rn || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "deno check: ${ERRORS} error(s); ratchet baseline ${DENO_CHECK_BASELINE}"

          if [ "$ERRORS" -gt "$DENO_CHECK_BASELINE" ]; then
            echo "::error::Edge-function type errors went UP: ${ERRORS} > baseline ${DENO_CHECK_BASELINE}. Fix the new errors listed above. Do not raise the baseline."
            exit 1
          fi

          if [ "$ERRORS" -lt "$DENO_CHECK_BASELINE" ]; then
            echo "::notice::Error count dropped to ${ERRORS}. Lower DENO_CHECK_BASELINE to ${ERRORS} in .github/workflows/ci.yml in this PR so the ratchet holds the ground you just took."
          fi

  seat-line-check:
    name: Seat trailer on PR commits
    runs-on: ubuntu-latest
    # Server-side mirror of scripts/pre-push-gate.sh Check 5. Local hooks never
    # fire on commits authored through the GitHub API, so this job catches the
    # exact path the hook cannot: API-authored commits and commits pushed via
    # tooling that bypasses local hooks.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history needed so git rev-list BASE..HEAD works correctly.
          fetch-depth: 0

      - name: Check Seat trailer on every non-merge PR commit
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          SEAT_PATTERN='^Seat: [a-z0-9-]+$'
          # GitHub injects a Claude co-author trailer on squash/rebase merges.
          # Drop it before the last-line check, mirroring the pre-push hook so
          # local and server enforcement share the same exemption and cannot drift.
          COAUTHOR_EXEMPT='^[[:space:]]*Co-authored-by:.*<noreply@anthropic\.com>[[:space:]]*$'

          TOTAL=$(git rev-list --count "$BASE..$HEAD")

          FAIL=0
          COUNT=0
          while read -r commit; do
            # Skip merge commits (2+ parents): they are automation, not seat work.
            PARENTS=$(git cat-file -p "$commit" | grep -c '^parent ' || true)
            if [ "$PARENTS" -ge 2 ]; then
              echo "skip (merge) ${commit:0:8}"
              continue
            fi
            COUNT=$((COUNT + 1))
            LAST_LINE=$(git log -1 --format='%B' "$commit" \
              | grep -viE "$COAUTHOR_EXEMPT" \
              | grep -vE '^[[:space:]]*$' | tail -1 || true)
            if ! printf '%s\n' "$LAST_LINE" | grep -qE "$SEAT_PATTERN"; then
              echo "::error::Commit ${commit:0:8} lacks a valid Seat: trailer (got: '${LAST_LINE}'). End the commit body with 'Seat: <seat-name>' matching ^Seat: [a-z0-9-]+\$."
              FAIL=1
            else
              echo "ok ${commit:0:8}: $LAST_LINE"
            fi
          done < <(git rev-list "$BASE..$HEAD")

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Commit range $BASE..$HEAD is empty -- the check ran over nothing. Verify BASE/HEAD are correct."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::All $TOTAL commit(s) in range are merge commits, which are exempt. Nothing to check."
            exit 0
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All $COUNT non-merge PR commit(s) carry a valid Seat: trailer."

  secdef-acl-guard:
    name: SECURITY DEFINER function ACL guard
    runs-on: ubuntu-latest
    # Why this job exists. Four SECURITY DEFINER functions in this schema had
    # their EXECUTE grant revoked from PUBLIC and anon by two forward-revoke
    # migrations (20260821000000 and 20260824230000). Postgres resets EXECUTE
    # on a function to PUBLIC every time that function is replaced, and PUBLIC
    # includes anon, so a later CREATE OR REPLACE quietly undoes the revoke.
    # has_role is the sharpest case: it is SECURITY DEFINER, returns boolean
    # and is reachable over PostgREST RPC, so an unauthenticated caller could
    # ask whether an arbitrary user id holds an arbitrary role.
    #
    # Until those two files were stamped as applied, the only thing standing in
    # the way was that they were unstamped: any replay or repair would have run
    # them again. Stamped, the runner will never replay them, so nothing at all
    # reasserts the revoke. 20260821000000's own header says "the proacl CI gate
    # enforces the same invariant". Checked at dev HEAD before writing this: no
    # such gate existed anywhere under .github. The sentence described a control
    # that was never built. This is that control.
    #
    # Shape: pure text over the migration files in the checkout. No database
    # access, no credentials, no network, and it fails BEFORE a reset can reach
    # a deployed environment. A live ACL probe would need prod read, which most
    # seats do not hold, and it could not run on a pull request at all.
    #
    # LIMITS, stated here rather than discovered later:
    #  - Files at or below BASELINE_CUTOFF are exempt, because several of them
    #    legitimately create these functions and predate the revokes. They are
    #    counted and listed in the job summary, never silently skipped.
    #  - A new migration deliberately given a version prefix at or below the
    #    cutoff would be exempt. Backdating a migration breaks ordering for
    #    other reasons and the duplicate-prefix guard above already fights it,
    #    but this check does not catch it.
    #  - The REVOKE must be on one line, in the canonical form the two
    #    forward-revoke files use. A REVOKE split over several lines fails this
    #    gate. That is deliberate: a security check that cannot parse a form
    #    should fail closed, and the error message says exactly what to write.
    env:
      # Version prefix of the newest migration that predates this guard. Files
      # at or below it may create these functions without re-revoking. Do NOT
      # raise this to make a new migration pass. Add the REVOKE instead.
      BASELINE_CUTOFF: '20260824230000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse a function replace that leaves EXECUTE open to anon
        shell: bash
        run: |
          set -uo pipefail
          MIG_DIR="supabase/migrations"

          # Fail loudly rather than green when there is nothing to inspect.
          # "examined 66 files, none offending" and "examined nothing because
          # the path is wrong" must not produce the same result.
          if [ ! -d "$MIG_DIR" ]; then
            echo "::error::${MIG_DIR} does not exist -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          COUNT=$(ls "$MIG_DIR"/*.sql 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No .sql files found under ${MIG_DIR} -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          # The four functions the forward-revoke migrations hardened.
          HARDENED="has_role advance_household_rotation_job expire_time_boxed_household_roles purge_expired_old_household_key_wraps"

          FAILED=0
          HITS=0
          EXEMPT=0

          for F in "$MIG_DIR"/*.sql; do
            BASE=$(basename "$F")
            VERSION=${BASE%%_*}

            for FN in $HARDENED; do
              if ! grep -Eiq "CREATE[[:space:]]+(OR[[:space:]]+REPLACE[[:space:]]+)?FUNCTION[[:space:]]+(public\.)?${FN}[[:space:]]*\(" "$F"; then
                continue
              fi
              HITS=$((HITS + 1))

              # Every migration filename in this repo starts with a 14 digit
              # version. One that does not cannot be compared against the
              # cutoff, so it is enforced rather than exempted.
              if printf '%s' "$VERSION" | grep -qE '^[0-9]{14}$' && ! [[ "$VERSION" > "$BASELINE_CUTOFF" ]]; then
                EXEMPT=$((EXEMPT + 1))
                echo "exempt (predates the guard) ${BASE}: public.${FN}"
                continue
              fi

              if grep -Eiq "REVOKE[[:space:]]+EXECUTE[[:space:]]+ON[[:space:]]+FUNCTION[[:space:]]+(public\.)?${FN}[[:space:]]*\(.*FROM[[:space:]]+PUBLIC[[:space:]]*,[[:space:]]*anon" "$F"; then
                echo "ok ${BASE}: public.${FN} is replaced and re-revoked in the same file"
                continue
              fi

              FAILED=1
              {
                echo "### :rotating_light: \`${FN}\` replaced without re-revoking EXECUTE"
                echo ""
                echo "\`${BASE}\` contains a CREATE (OR REPLACE) FUNCTION for"
                echo "\`public.${FN}\`, which is SECURITY DEFINER and was revoked from"
                echo "PUBLIC and anon by an earlier migration."
                echo ""
                echo "Postgres resets EXECUTE on a replaced function to PUBLIC, and"
                echo "PUBLIC includes anon, so this replace reopens it. Nothing"
                echo "reasserts the revoke on its own: the two forward-revoke"
                echo "migrations are stamped as applied and will not be replayed."
                echo ""
                echo "Add this line to the same file, inside the same transaction,"
                echo "after the function body:"
                echo ""
                echo '```sql'
                echo "REVOKE EXECUTE ON FUNCTION public.${FN}(<arg types>) FROM PUBLIC, anon;"
                echo "GRANT  EXECUTE ON FUNCTION public.${FN}(<arg types>) TO authenticated, service_role;"
                echo '```'
                echo ""
                echo "It must be on one line, which is the form this gate reads."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::${BASE} replaces public.${FN} without re-applying REVOKE EXECUTE ON FUNCTION public.${FN}(...) FROM PUBLIC, anon in the same file."
            done
          done

          # A matcher that quietly stops matching is the failure this whole job
          # exists to prevent, so it is not allowed to happen here either. Seven
          # of these statements exist in this repo's history; zero means the
          # pattern or the checkout is broken, not that the tree is clean.
          if [ "$HITS" -eq 0 ]; then
            echo "::error::Scanned ${COUNT} migration file(s) and matched no CREATE FUNCTION for any of the four hardened functions. Seven exist in this repo's history, so this is a broken check, not a clean tree."
            exit 1
          fi

          echo "examined ${COUNT} migration file(s): ${HITS} statement(s) create or replace a hardened function, ${EXEMPT} exempt as predating the guard (cutoff ${BASELINE_CUTOFF})"
          exit $FAILED
