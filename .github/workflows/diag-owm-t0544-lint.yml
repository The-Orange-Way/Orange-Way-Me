name: DIAG OWM-T0544 lint

# TEMPORARY, same rules as diag-owm-t0544.yml: diag/ branches only, deleted with
# the branch. Round one proved the failure is lint and nothing else. This round
# says which file and which rule.

on:
  push:
    branches:
      - 'diag/**'

permissions:
  contents: read

jobs:
  per-file:
    name: DIAG L1 eslint one file
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - src/lib/or/or-sync-request.ts
          - src/lib/or/sync-route.ts
          - src/lib/or/sync-all.ts
          - src/components/connections/ConnectionsPage.tsx
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx eslint "${{ matrix.target }}"

  per-dir-tests:
    name: DIAG L2 eslint the or test files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx eslint "src/lib/or/__tests__"

  capture:
    name: DIAG L3 capture the eslint text onto this branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run lint and keep the output
        run: |
          set -uo pipefail
          mkdir -p diag-out
          bun run lint > diag-out/lint-full.txt 2>&1 || true
          tail -c 30000 diag-out/lint-full.txt > diag-out/lint.txt
          rm -f diag-out/lint-full.txt
          wc -l diag-out/lint.txt
      - name: Commit the output back to this diagnostic branch
        run: |
          set -euo pipefail
          git config user.name "orange-way-diag"
          git config user.email "diag@users.noreply.github.com"
          git add diag-out/lint.txt
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -F - <<'MSG'
          DIAG output: eslint result for the OWM-T0544 branch

          Written by the diagnostic workflow so the failure can be read. Never
          merged: this lives only on the diag/ branch and dies with it.

          Seat: srdev-owm
          MSG
          git push origin "HEAD:${GITHUB_REF_NAME}"
