# ============================================================
# Edge function per-function settings
# ============================================================
#
# Any function NOT listed here gets verify_jwt = true by default, and
# the gateway will 401 the request before the function body runs. Every
# function that authenticates its caller by some means other than a
# Supabase user JWT (a cron secret, an HMAC signature) must therefore
# declare verify_jwt = false explicitly, with a comment saying what the
# real authentication is.

# TEMPORARY EXPERIMENT (verify_jwt drift investigation): the
# sweep-expired-household-roles exemption is removed on dev only, to test
# whether the deploy workflow reconciles verify_jwt on an already-existing
# function or only sets it at creation. This is reverted immediately after
# the probe. The function still checks its own cron secret; removing the
# gateway exemption only affects the dev cron for the test window.

# or-webhook-receiver is called server-to-server by OrangeRails, which
# cannot mint a Supabase user JWT. Authentication is the HMAC signature
# on the request body (X-OR-Signature-V2, timestamped and replay-bounded),
# verified constant-time against the shared OR_WEBHOOK_SECRET before any
# work is done; an unverified request gets a 401 from the function
# itself. Without this override the gateway rejects every delivery.
[functions.or-webhook-receiver]
verify_jwt = false

# ============================================================
# Auth hooks
# ============================================================
#
# before_user_created runs public.enforce_beta_signup(jsonb) as a GoTrue
# auth hook. It redeems the invite code atomically and rejects a signup
# that carries no valid code: this is the private-beta gate. The database
# side (the function plus EXECUTE to supabase_auth_admin) is present on
# both dev and prod.
#
# DECLARATIVE ONLY right now: no deploy workflow runs `supabase config
# push`, so the hosted project's source of truth for this hook is still the
# Studio dashboard, not this file. Do NOT assume this block enforces
# anything on its own.
#
# Before wiring `config push` into CI, read this. config push writes the
# WHOLE auth config, and the Turnstile captcha secret lives in dashboard-set
# Auth config (see .github/workflows/deploy.yml, VITE_TURNSTILE_SITE_KEY).
# A push from a config.toml that does not also declare captcha would clobber
# that secret and break sign-in. Declare captcha here first, push dev only,
# read the Auth settings back, then prod separately. Never push both at once.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/enforce_beta_signup"
